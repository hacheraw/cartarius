<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECE2CA">
<title>Cartarius · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/cartarius.css">
<link rel="stylesheet" href="css/quiz.css">
</head>
<body class="quiz phone">
<header class="p-head"><b>Cartarius</b><span id="hName"></span><span id="hScore"></span></header>

<!-- Unirse -->
<main class="p-screen" id="join">
  <h1 data-i18n="play.title">Unirse al Quiz</h1>
  <label class="p-field"><span data-i18n="play.code">Código de sala</span><input id="jCode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text"></label>
  <label class="p-field"><span data-i18n="play.name">Tu nombre</span><input id="jName" maxlength="24" autocomplete="nickname"></label>
  <p class="q-err" id="jErr" hidden></p>
  <button class="btn primary big" id="jBtn" data-i18n="play.join">Entrar</button>
</main>

<!-- Esperando -->
<main class="p-screen center" id="wait" hidden>
  <h1 id="wHello"></h1>
  <p data-i18n="play.wait">Mira la pantalla: la partida empezará enseguida.</p>
</main>

<!-- Pregunta -->
<main class="p-screen" id="question" hidden>
  <div class="q-top"><span class="q-progress" id="pProg"></span></div>
  <div class="q-timer"><i id="pTimer"></i></div>
  <p class="p-q" id="pText"></p>
  <div class="p-options" id="pOptions"></div>
  <p class="p-status" id="pStatus" hidden></p>
</main>

<!-- Resultado de la pregunta -->
<main class="p-screen center" id="result" hidden>
  <div class="p-verdict" id="rVerdict"></div>
  <p class="p-was" id="rWas"></p>
  <p class="p-total" id="rTotal"></p>
  <p class="p-next" id="rNext"></p>
</main>

<!-- Final -->
<main class="p-screen center" id="end" hidden>
  <h1 data-i18n="play.end">Fin de la partida</h1>
  <div class="p-pos" id="ePos"></div>
  <p id="eHits"></p>
</main>

<script src="js/vendor/firebase/firebase-app-compat.js"></script>
<script src="js/vendor/firebase/firebase-auth-compat.js"></script>
<script src="js/vendor/firebase/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/net.js"></script>
<script src="js/quiz-play.js"></script>
</body>
</html>
