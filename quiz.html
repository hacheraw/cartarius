<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartarius · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/cartarius.css">
<link rel="stylesheet" href="css/quiz.css">
</head>
<body class="quiz host">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="compass" viewBox="-50 -50 100 100">
    <circle r="44" fill="none" stroke="#8C6C45" stroke-width="1.2"/>
    <circle r="38" fill="none" stroke="#8C6C45" stroke-width=".6"/>
    <g fill="#A8823A" stroke="#6B5A45" stroke-width=".6">
      <path d="M0-46 6-6 0 0-6-6Z"/><path d="M46 0 6 6 0 0 6-6Z" fill="#E3D6B8"/><path d="M0 46-6 6 0 0 6 6Z" fill="#E3D6B8"/><path d="M-46 0-6-6 0 0-6 6Z" fill="#E3D6B8"/>
      <path d="M0-46 0 0-6-6Z" fill="#6E1F2E"/>
    </g>
    <g fill="none" stroke="#8C6C45" stroke-width=".6"><path d="M-27-27 27 27M27-27-27 27"/></g>
    <circle r="3" fill="#F5EEDC" stroke="#6B5A45" stroke-width=".8"/>
  </symbol>
</svg>
<header class="bar">
  <a class="brand" href="index.html"><svg><use href="#compass"/></svg><b>Cartarius</b></a>
  <div class="cat-title" data-i18n="quiz.title">Quiz</div>
  <div class="bar-code" id="barCode" hidden><small data-i18n="quiz.room">Sala</small><b id="barCodeVal"></b></div>
  <a class="btn" href="index.html" id="backBtn" data-i18n="quiz.back">Completa el mapa</a>
</header>

<!-- Preparación: ajustes + sala -->
<main class="q-setup" id="setup">
  <section class="q-card">
    <h2 data-i18n="quiz.setup">La partida</h2>
    <div class="q-field">
      <h3 data-i18n="quiz.types">Preguntas</h3>
      <div class="q-checks" id="sTypes">
        <label><input type="checkbox" value="flag" checked> <span data-i18n="qt.flag">Banderas</span></label>
        <label><input type="checkbox" value="capital" checked> <span data-i18n="qt.capital">Capitales</span></label>
        <label><input type="checkbox" value="river"> <span data-i18n="qt.river">Ríos</span></label>
        <label><input type="checkbox" value="city"> <span data-i18n="qt.city">Ciudades</span></label>
        <label><input type="checkbox" value="shape"> <span data-i18n="qt.shape">Siluetas</span></label>
      </div>
    </div>
    <div class="q-field"><h3 data-i18n="quiz.region">Regiones</h3><div class="q-checks" id="sRegions"></div></div>
    <div class="q-field"><h3 data-i18n="quiz.count">Número de preguntas</h3><div class="seg" id="sCount" data-values="5,10,15,20,30"></div></div>
    <div class="q-field"><h3 data-i18n="quiz.time">Tiempo por pregunta</h3><div class="seg" id="sTime" data-values="5,10,15,20,30"></div></div>
    <div class="q-field"><h3 data-i18n="quiz.gap">Tiempo entre preguntas</h3><div class="seg" id="sGap" data-values="5,8,10,15,20,0"></div></div>
    <div class="q-field"><h3 data-i18n="quiz.options">Opciones por pregunta</h3><div class="seg" id="sOpts" data-values="2,3,4"></div></div>
    <p class="q-err" id="sErr" hidden></p>
  </section>

  <section class="q-card q-room" id="roomCard">
    <div id="roomEmpty" class="q-room-empty">
      <svg class="q-compass"><use href="#compass"/></svg>
      <button class="btn primary big" id="createBtn" data-i18n="quiz.create">Crear sala</button>
      <p class="q-note" id="roomMsg" hidden></p>
      <p class="q-err" id="createErr" hidden></p>
    </div>
    <div id="roomOpen" hidden>
      <div class="q-join">
        <div class="q-join-text">
          <small data-i18n="quiz.joinAt">Entra desde el móvil en</small>
          <div class="q-url" id="joinUrl"></div>
          <small data-i18n="quiz.room">Sala</small>
          <div class="q-code" id="roomCode">····</div>
        </div>
        <div class="q-qr" id="qr" role="img"></div>
      </div>
      <p class="q-note" id="localNote" hidden></p>
      <h3><span data-i18n="quiz.players">Jugadores</span> <span class="q-count" id="pCount">0</span></h3>
      <ul class="q-players" id="players"></ul>
      <button class="btn primary big" id="startBtn" disabled data-i18n="quiz.start">Empezar partida</button>
      <h3 data-i18n="quiz.history">Historial</h3>
      <ul class="q-history" id="history"></ul>
      <button class="btn link" id="newRoomBtn" data-i18n="quiz.newRoom">Nueva sala</button>
    </div>
  </section>
</main>

<!-- Pregunta y respuesta -->
<main class="q-play" id="play" hidden>
  <div class="q-top">
    <span class="q-progress" id="qProg"></span>
    <span class="q-answered" id="qAnswered"></span>
    <b class="q-clock" id="qClock" aria-live="off"></b>
    <button class="btn q-pause" id="pauseBtn" title="P"><span aria-hidden="true">❚❚</span> <span data-i18n="quiz.pause">Pausa</span></button>
  </div>
  <div class="q-timer"><i id="qTimer"></i></div>
  <h1 class="q-text" id="qText"></h1>
  <div class="q-prompt" id="qPrompt"></div>
  <ol class="q-options" id="qOptions"></ol>
  <div class="q-reveal" id="qReveal" hidden>
    <div class="q-hits" id="qHits"></div>
    <div class="q-mini"><h3 data-i18n="quiz.top">Clasificación</h3><ol id="qTop"></ol></div>
    <div class="q-next"><span id="qNextIn"></span><button class="btn primary big" id="nextBtn" data-i18n="quiz.next">Siguiente ›</button></div>
  </div>
  <div class="q-paused" id="paused" hidden>
    <div class="q-card">
      <h2 data-i18n="quiz.paused">Partida en pausa</h2>
      <p class="q-note" data-i18n="quiz.pausedNote"></p>
      <div class="actions"><button class="btn primary big" id="resumeBtn" data-i18n="quiz.resume">Continuar</button><button class="btn big" id="stopBtn" data-i18n="quiz.stop">Terminar partida</button></div>
    </div>
  </div>
</main>

<!-- Final -->
<main class="q-final" id="final" hidden>
  <h1 data-i18n="quiz.final">Resultados</h1>
  <div class="q-stats" id="fStats"></div>
  <table class="rank q-rank" id="fTable"></table>
  <div class="actions"><button class="btn primary big" id="againBtn" data-i18n="quiz.again">Otra partida</button></div>
</main>

<script src="js/vendor/d3.min.js"></script>
<script src="data/world.js"></script>
<script src="data/countries.js"></script>
<script src="data/features.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/vendor/firebase/firebase-app-compat.js"></script>
<script src="js/vendor/firebase/firebase-auth-compat.js"></script>
<script src="js/vendor/firebase/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/geo.js"></script>
<script src="js/net.js"></script>
<script src="js/quiz-questions.js"></script>
<script src="js/quiz-host.js"></script>
</body>
</html>
